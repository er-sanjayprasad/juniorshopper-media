name: Make voices
on:
  push:
    paths: ["jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/tts.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - run: |
          git config user.name "JuniorShopper Bot"
          git config user.email "bot@juniorshopper.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add generated voices" && git push)
